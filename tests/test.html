<h2>Offer History for Sleeper - browser tests (dummy data only)</h2>
<div id="summary">Running…</div>
<div id="out"></div>
<div id="stage"></div>
<script>
  // The extension reads these at load time; everything here is fake.
  window.__OSH_TEST__ = {};
  localStorage.setItem('user_id', '"U_ME"');
  localStorage.removeItem('__osh:v1');
  localStorage.removeItem('__osh:v1:players');
  history.replaceState(null, '', '/leagues/100000000000000001/trades');
  // Keep the page quiet if the extension tries the network by mistake.
  window.__netCalls = [];
  const realFetch = window.fetch;
  window.fetch = function (u) { window.__netCalls.push(String(u)); return realFetch.apply(this, arguments); };
</script>
